name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite exercises real Postgres behaviour -- CHECK constraints, the
    # append-only triggers, transactional rollback, row locks, advisory locks and
    # ON CONFLICT semantics -- so CI needs a real database. None of it can run
    # against SQLite or a mock.
    #
    # Phase 4's concurrency harness opens up to 60 connections at once (pool_size
    # 25 + max_overflow 35, see app/db.py). postgres:16 defaults to
    # max_connections=100, so the stock service configuration has enough headroom;
    # if the pool is ever widened past ~95, this service needs an explicit
    # `command: postgres -c max_connections=...`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Note the port: 5432 here (the service mapping), 5433 locally (compose).
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ledgerline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to match the local venv exactly. The version lives here and in
          # ruff's target-version in pyproject.toml, and nowhere else.
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres -d ledgerline; then
              echo "postgres is ready"
              exit 0
            fi
            echo "waiting for postgres ($i/30)..."
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          exit 1

      - name: Migrate
        run: alembic upgrade head

      # A down-migration nobody runs is a down-migration that does not work. This
      # round-trips the newest revision -- down one, back up to head -- so a
      # downgrade() that drops a table it never created, or forgets an index, is a
      # red build rather than a discovery made during a rollback at 3am. Safe to run
      # before the suite: the tests TRUNCATE everything they touch anyway.
      - name: Down-migration round-trips
        run: |
          alembic downgrade 0006
          alembic upgrade head

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      # Both background workers are separate processes, and the suite deliberately
      # does not spawn either -- the tests call sweep_once() and publish_once()
      # directly, so there is no background worker to wait on, nothing to kill, and
      # nothing that can hang. These steps cover the other half: that each CLI entry
      # point starts, connects, does one pass and *exits*. --once and --status are
      # what make them short-lived; the timeout is what turns "it looped forever"
      # into a red build instead of a stuck runner.
      - name: Reconciler CLI runs and exits
        timeout-minutes: 2
        run: python -m app.reconcile --once

      - name: Reconciler --list runs and exits
        timeout-minutes: 2
        run: python -m app.reconcile --list

      - name: Publisher CLI runs and exits
        timeout-minutes: 2
        run: python -m app.publisher --once

      - name: Publisher --status runs and exits
        timeout-minutes: 2
        run: python -m app.publisher --status

      # The Phase 6 drift job. Bounded like the others, and note what it is NOT:
      # it exits 0 even when it finds drift, because drift is a thing to read
      # rather than a thing that failed. A red build for a condition CI cannot fix
      # is how a report ends up disabled.
      - name: Drift detector runs and exits
        timeout-minutes: 2
        run: python -m app.drift --once

      - name: Drift detector --json runs and exits
        timeout-minutes: 2
        run: python -m app.drift --json

      # Phase 7. The image is what actually gets deployed, so a build that only
      # ever happens on Fly is a build that breaks on Fly. This catches a bad
      # Dockerfile here, where it costs a red check instead of a failed release.
      - name: Docker image builds
        run: docker build -t ledgerline:ci .

      # And that the image is what it claims: the right Python, a non-root user,
      # and production defaults baked in. The Python check is not ceremony -- the
      # Dockerfile said 3.12 until Phase 7 while CI tested on 3.13, so the
      # container had never run the interpreter the suite was green against.
      - name: Image runs the pinned Python, unprivileged, hardened
        run: |
          docker run --rm ledgerline:ci python -c "
          import os, sys
          assert sys.version_info[:2] == (3, 13), sys.version
          assert os.getuid() != 0, 'must not run as root'
          from app.config import settings
          assert settings.is_production, settings.APP_ENV
          assert settings.test_affordances_allowed is False
          print('image ok:', sys.version.split()[0], 'uid', os.getuid())
          "

      # The production guard, exercised end to end: selecting a deliberately broken
      # path must abort startup rather than come up healthy and be wrong under load.
      - name: Production refuses to start on a broken path
        run: |
          if docker run --rm -e IDEMPOTENCY_CLAIM_STRATEGY=naive ledgerline:ci python -c "import app.config" 2>/dev/null; then
            echo "FAIL: production accepted a deliberately broken strategy" >&2
            exit 1
          fi
          echo "production correctly refused to start"
