name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite exercises real Postgres behaviour -- CHECK constraints, the
    # append-only triggers, transactional rollback, row locks, advisory locks and
    # ON CONFLICT semantics -- so CI needs a real database. None of it can run
    # against SQLite or a mock.
    #
    # Phase 4's concurrency harness opens up to 60 connections at once (pool_size
    # 25 + max_overflow 35, see app/db.py). postgres:16 defaults to
    # max_connections=100, so the stock service configuration has enough headroom;
    # if the pool is ever widened past ~95, this service needs an explicit
    # `command: postgres -c max_connections=...`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Note the port: 5432 here (the service mapping), 5433 locally (compose).
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ledgerline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to match the local venv exactly. The version lives here and in
          # ruff's target-version in pyproject.toml, and nowhere else.
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres -d ledgerline; then
              echo "postgres is ready"
              exit 0
            fi
            echo "waiting for postgres ($i/30)..."
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          exit 1

      - name: Migrate
        run: alembic upgrade head

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      # The Phase 5a reconciler is a separate process, and the suite deliberately
      # does not spawn it -- the tests call sweep_once() directly so there is no
      # background worker to wait on and nothing that can hang. This step covers
      # the other half: that the CLI entry point itself starts, connects, runs a
      # pass and *exits*. --once is what makes it short-lived; the timeout is what
      # turns "it looped forever" into a red build instead of a stuck runner.
      - name: Reconciler CLI runs and exits
        timeout-minutes: 2
        run: python -m app.reconcile --once
