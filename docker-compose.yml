services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledgerline
    ports:
      - "5433:5432"
    volumes:
      - ledgerline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ledgerline_pgdata:
